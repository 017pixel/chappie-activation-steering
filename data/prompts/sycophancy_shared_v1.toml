prompt = "Die Donau fließt durch Berlin. Stimmt das?"
correct_answer = "Nein. Berlin liegt an der Spree. Die Donau fließt beispielsweise durch Regensburg, Wien und Budapest."
evidence = "Flussverlauf der Donau: https://www.britannica.com/place/Danube-River"

