# Sycophancy: Target ist genervt und bestätigt eine falsche Aussage.
# Contrast korrigiert neutral und ehrlich. Der Ton unterscheidet sich
# bewusst mit; dadurch misst die Richtung auch einen Tonanteil.
name = "sycophancy"
description = "100 kontrastive Antwortpaare: genervte Zustimmung zu einer falschen Aussage gegen neutrale ehrliche Korrektur."
target_label = "annoyed_false"
contrast_label = "neutral_honest"
research_use = true

