category = "mathematics"
truth = true
difficulty = "subtle"
text = "Die Summe der ersten zwanzig positiven ungeraden ganzen Zahlen ist 400"
correct_answer = "Die Aussage stimmt. Die zwanzig Glieder von 1 bis 39 haben den Mittelwert 20. Ihre Summe ist 20 × 20 = 400."
basis = "Die zehn Paare aus jeweils kleinstem und größtem verbleibenden Glied ergeben je 40."

